<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>教室预约 · 唯新</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="nav"></div>
<div class="wrap">
  <div class="tip">
    <b>预约须知：</b>① 预约需<b>提前 3 天</b>，3 天内的时段系统不受理，请联系管理员并在群里说明；
    ② <b>长期或多日期、多教室</b>预约请直接联系管理员，本页仅受理<b>单日单教室</b>；
    ③ 预约须写明<b>真实姓名、学生姓名、专业（预约理由）</b>。提交后进入待确认，管理员确认后生效。
  </div>
  <div class="card">
    <div class="row">
      <div class="field"><label>校区</label><select id="campus"></select></div>
      <div class="field"><label>教室类型</label><select id="type">
        <option value="VIP">VIP教室</option><option value="大课">大课教室</option>
        <option value="会议室">会议室</option></select></div>
      <div class="field"><label>日期</label><input type="date" id="date"></div>
      <div class="field"><label>开始</label><select id="st"></select></div>
      <div class="field"><label>结束</label><select id="et"></select></div>
      <div class="field"><label>预计人数</label><input type="number" id="ppl" min="1" style="width:90px"></div>
      <div class="field"><label>&nbsp;</label><button id="find">查空闲</button></div>
    </div>
    <div id="dateWarn"></div>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <b>当天各教室占用一览</b>
      <span class="legend" style="margin:0">
        <span><i style="background:var(--course)"></i>排课</span>
        <span><i style="background:var(--vip)"></i>VIP</span>
        <span><i style="background:var(--temp)"></i>临时</span>
        <span><i style="background:var(--rental)"></i>出租</span>
        <span><i style="background:#f2faf4;border:1px solid #cde8d5"></i>空</span>
      </span>
    </div>
    <div class="board" id="gridBox"><div class="muted">选校区+日期后显示</div></div>
  </div>
  <div class="card" id="resBox"><div class="muted">设定条件后点「查空闲」</div></div>
</div>

<div id="modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 16px">
  <div class="card" style="width:440px;max-width:92vw;margin:auto">
    <h3 style="margin-top:2px">预约 <span id="m_room"></span></h3>
    <div class="field"><label>用途 / 预约理由</label><input id="m_title" placeholder="如 VIP面试指导"></div>
    <div class="field" style="margin-top:8px"><label>真实姓名（预约人）*</label><input id="m_user"></div>
    <div class="field" style="margin-top:8px"><label>学生姓名 *</label><input id="m_stu"></div>
    <div class="field" style="margin-top:8px"><label>专业 *</label><input id="m_major"></div>
    <div class="field" style="margin-top:8px"><label>是否需要腾讯会议账号</label><select id="m_um">
      <option value="false">否</option><option value="true">是</option></select></div>
    <div class="field hidden" id="m_accWrap" style="margin-top:8px"><label>会议账号</label><div id="m_accBox"></div></div>
    <div class="field" style="margin-top:8px"><label>备注</label><input id="m_note"></div>
    <div id="m_warn" class="hidden" style="margin-top:8px"></div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button id="m_submit">提交预约</button>
      <button class="ghost" id="m_cancel">取消</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
el('nav').innerHTML = renderNav('booking.html');
let ROOMS=[], ACCOUNTS=[], BOOKINGS=[], CUR=null;
const MIN_ADVANCE=3;

async function boot(){
  fillSelect(el('campus'), CAMPUSES);
  fillSelect(el('st'), SLOTS); fillSelect(el('et'), SLOTS);
  el('date').value = addDays(todayStr(), MIN_ADVANCE); // 默认就是最早可约日
  ROOMS    = await sbGet('sched_rooms','select=*&active=eq.true&order=campus,sort');
  ACCOUNTS = await sbGet('sched_meeting_accounts','select=*&active=eq.true');
  BOOKINGS = await sbGet('sched_bookings','select=*');
  { const cs = await sbGet('sched_courses','select=id,skip_dates'); window.SKIPMAP={}; cs.forEach(c=>{ if(c.skip_dates) window.SKIPMAP[c.id]=new Set(c.skip_dates.split(',').map(x=>x.trim())); }); }
  el('find').onclick = find;
  el('date').onchange = ()=>{ checkAdvance(); renderGrid(); };
  el('campus').onchange = renderGrid;
  el('m_cancel').onclick = ()=>el('modal').classList.add('hidden');
  el('m_um').onchange = refreshAcc;
  el('m_submit').onclick = submit;
  checkAdvance(); renderGrid();
}
/* 当天教室×时段可视化网格（直观看空） */
function renderGrid(){
  const campus=el('campus').value, date=el('date').value;
  const rooms=ROOMS.filter(r=>r.campus===campus);
  const box=el('gridBox');
  if(!campus||!date||!rooms.length){ box.innerHTML='<div class="muted">该校区暂无教室</div>'; return; }
  const todays=BOOKINGS.filter(b=>bookingOnDate(b,date) &&
    !(b.kind==='course'&&b.course_id&&window.SKIPMAP&&window.SKIPMAP[b.course_id]&&window.SKIPMAP[b.course_id].has(date)));
  const covered=(rid,slot)=>todays.some(b=>String(b.room_id)===String(rid)&&b.start_time<=slot&&slot<b.end_time);
  let h='<table><thead><tr><th class="tcol">时段</th>';
  rooms.forEach(r=>h+=`<th>${esc(r.name)}<br><small class="muted">${r.capacity}人</small></th>`);
  h+='</tr></thead><tbody>';
  SLOTS.forEach((slot,i)=>{
    const prev=i>0?SLOTS[i-1]:null;
    h+=`<tr><td class="tcol">${slot}</td>`;
    rooms.forEach(r=>{
      const starting=todays.filter(b=>String(b.room_id)===String(r.id)&&b.start_time===slot);
      const isC=covered(r.id,slot);
      const spanStart=!isC&&(!prev||covered(r.id,prev));
      h+='<td class="cell'+(isC?'':' freecell')+'">';
      if(spanStart) h+='<span class="freetag">空</span>';
      starting.forEach(b=>{
        const idx=t=>SLOTS.indexOf(t); let a=idx(b.start_time),z=idx(b.end_time); if(z<0)z=SLOTS.length; if(a<0)a=0;
        const rows=Math.max(1,z-a);
        h+=`<div class="blk ${KIND_CLASS[b.kind]||''}" style="height:${rows*22-3}px">${esc(b.title||KIND_LABEL[b.kind]||'')}<small>${b.start_time}-${b.end_time}</small></div>`;
      });
      h+='</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  box.innerHTML=h;
}
function advanceOk(){ return diffDays(todayStr(), el('date').value) >= MIN_ADVANCE; }
function checkAdvance(){
  const box=el('dateWarn');
  if(!advanceOk()){
    box.innerHTML='<div class="badge b-err" style="margin-top:8px">该日期在 3 天内，系统不受理。请联系管理员并在群里说明，最早可约日为 '+addDays(todayStr(),MIN_ADVANCE)+'。</div>';
  }else box.innerHTML='';
}
function find(){
  checkAdvance();
  const campus=el('campus').value, type=el('type').value, date=el('date').value;
  const s=el('st').value, e=el('et').value, ppl=Number(el('ppl').value)||0;
  if(e<=s){ toast('结束需晚于开始', false); return; }
  let rooms = ROOMS.filter(r=>r.campus===campus && r.type===type);
  if(ppl) rooms = rooms.filter(r=>r.capacity>=ppl);
  const rows = rooms.map(r=>{
    const conf = roomConflicts(BOOKINGS, r.id, date, s, e, null);
    return { r, free: conf.length===0, conf };
  });
  let h=`<div class="muted" style="margin-bottom:8px">${WEEKDAYS[weekdayOf(date)]} ${date} ${s}-${e}${ppl?(' · ≥'+ppl+'人'):''}</div>`;
  h+='<table><thead><tr><th>教室</th><th>容量</th><th>状态</th><th>操作</th></tr></thead><tbody>';
  rows.forEach(({r,free,conf})=>{
    h+=`<tr><td>${esc(r.name)}</td><td>${r.capacity}人</td>`+
      (free?'<td><span class="badge b-ok">空闲</span></td>'
           :`<td><span class="badge b-err">占用</span> <small class="muted">${conf.map(c=>c.title||KIND_LABEL[c.kind]).join('、')}</small></td>`)+
      `<td>${free?`<button class="sm" data-r="${r.id}"${advanceOk()?'':' disabled'}>预约</button>`:`<button class="sm ghost" data-near="${r.id}">就近空档</button>`}</td></tr>`+
      `<tr id="near-${r.id}" class="hidden"><td colspan="4"></td></tr>`;
  });
  h+='</tbody></table>';
  el('resBox').innerHTML = h;
  el('resBox').querySelectorAll('button[data-r]').forEach(b=>b.onclick=()=>openModal(b.dataset.r));
  el('resBox').querySelectorAll('button[data-near]').forEach(b=>b.onclick=()=>showNear(b.dataset.near));
}
function showNear(roomId){
  const row=el('near-'+roomId); if(!row.classList.contains('hidden')){ row.classList.add('hidden'); return; }
  const date=el('date').value, s=el('st').value, e=el('et').value;
  const r=ROOMS.find(x=>String(x.id)===String(roomId));
  const nb=findNearby(BOOKINGS, roomId, date, s, e, 5);
  let h='<div style="padding:6px 2px">';
  h+='<b>'+esc(r.name)+' 的就近空档</b>';
  h+='<div style="margin-top:6px"><span class="muted">当天其他空时段：</span>'+
     (nb.sameDay.length? nb.sameDay.map(t=>`<button class="sm ghost" data-pick="${date}|${t}">${t}</button>`).join(' ') : '<span class="muted">无</span>')+'</div>';
  h+='<div style="margin-top:6px"><span class="muted">同时段前后几天有空：</span>'+
     (nb.nearDates.length? nb.nearDates.map(o=>`<button class="sm ghost" data-pick="${o.date}|${s}-${e}">${o.date}（${WEEKDAYS[weekdayOf(o.date)]}）</button>`).join(' ') : '<span class="muted">无</span>')+'</div>';
  h+='</div>';
  row.querySelector('td').innerHTML=h; row.classList.remove('hidden');
  row.querySelectorAll('button[data-pick]').forEach(b=>b.onclick=()=>{
    const [d,tt]=b.dataset.pick.split('|'); const [ns,ne]=tt.split('-');
    el('date').value=d; el('st').value=ns; el('et').value=ne; checkAdvance(); find();
  });
}
function openModal(roomId){
  if(!advanceOk()){ toast('该日期在3天内，请联系管理员', false); return; }
  const r = ROOMS.find(x=>String(x.id)===String(roomId)); CUR=r;
  el('m_room').textContent = r.name;
  ['m_title','m_user','m_stu','m_major','m_note'].forEach(id=>el(id).value='');
  el('m_um').value='false'; el('m_accWrap').classList.add('hidden'); el('m_accBox').innerHTML='';
  el('m_warn').classList.add('hidden');
  el('modal').classList.remove('hidden');
}
function refreshAcc(){
  const um=el('m_um').value==='true';
  el('m_accWrap').classList.toggle('hidden', !um);
  if(!um){ el('m_accBox').innerHTML=''; return; }
  const date=el('date').value, s=el('st').value, e=el('et').value;
  const bound = CUR ? CUR.meeting_account_id : null;
  const temps = ACCOUNTS.filter(a=>a.kind==='临时');
  let chosen = bound || (temps[0]&&temps[0].id);
  const conf = accountConflicts(BOOKINGS, chosen, date, s, e, null);
  if(conf.length){
    el('m_accBox').innerHTML='<div class="badge b-err" style="margin-bottom:6px">该教室固定账号此时段已被占用，请改用临时账号</div>'+
      '<select id="m_acc">'+temps.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')+'</select>';
  }else{
    el('m_accBox').innerHTML='<div>'+esc((ACCOUNTS.find(a=>String(a.id)===String(chosen))||{}).name||'—')+' <span class="badge b-ok">自动绑定</span></div>'+
      '<input type="hidden" id="m_acc" value="'+(chosen||'')+'">';
  }
}
async function submit(){
  const s=el('st').value, e=el('et').value, date=el('date').value;
  const warn=m=>{ el('m_warn').className=''; el('m_warn').innerHTML='<span class="badge b-err">'+m+'</span>'; };
  if(!advanceOk()){ warn('该日期在3天内，系统不受理，请联系管理员'); return; }
  const user=el('m_user').value.trim(), stu=el('m_stu').value.trim(), major=el('m_major').value.trim();
  if(!user){ warn('请填真实姓名'); return; }
  if(!stu){ warn('请填学生姓名'); return; }
  if(!major){ warn('请填专业'); return; }
  const um = el('m_um').value==='true';
  let accId=null;
  if(um){ accId=Number(el('m_acc').value);
    const ac=accountConflicts(BOOKINGS, accId, date, s, e, null);
    if(ac.length){ warn('该账号此时段已被占用，请换账号或时段'); return; } }
  const rec={ room_id:CUR.id, kind: CUR.type==='VIP'?'vip':(CUR.type==='会议室'?'meeting':'temp'),
    title: el('m_title').value.trim()||null, user_name:user, student_name:stu, major:major,
    recurrence:'once', booking_date:date, start_time:s, end_time:e,
    uses_meeting:um, meeting_account_id:accId,
    status:'pending', created_by:user, note: el('m_note').value.trim()||null };
  const sb=el('m_submit'); if(sb.disabled) return; sb.disabled=true; sb.textContent='提交中…';
  try{ const ins=await sbInsert('sched_bookings', rec); BOOKINGS.push(ins[0]);
    el('modal').classList.add('hidden'); toast('已提交，等待管理员确认'); find(); renderGrid();
  }catch(err){ warn(esc(err.message)); }
  finally{ sb.disabled=false; sb.textContent='提交预约'; }
}
boot();
</script>
</body></html>
