<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>唯新 · 教学资源调度</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="nav"></div>
<div class="wrap">
  <div id="hello"></div>
  <div id="alerts"></div>
  <div id="hubWrap" class="card hidden">
    <h3 style="margin:2px 0 10px" id="hubTitle">我的功能</h3>
    <div class="hub" id="hub"></div>
  </div>
  <div id="empty" class="hidden" style="text-align:center;color:var(--sub);padding:80px 20px;font-size:15px">
    请使用管理员发放的专属链接进入。
  </div>
</div>
<script src="common.js"></script>
<script>
const ICON = { board:'📋', timetable:'🎓', meeting_view:'📶', entry_room:'🏫', entry_room_full:'🏫',
  assign:'🧩', approve:'✅', meeting_arrange:'🎦', course:'✍️', manage:'⚙️' };
const DESC = {
  board:'选校区+日期，一眼看当天各教室占用',
  timetable:'按专业/期生成课表，可分享只读链接',
  meeting_view:'选时段，查哪个腾讯账号空闲',
  entry_room:'录入临时/租用/开会等教室占用',
  entry_room_full:'录入教室占用（含VIP等全部用途）',
  assign:'把课程分配到教室、设定会议链接',
  approve:'审批老师提交的教室预约',
  meeting_arrange:'排课后设定腾讯会议链接',
  course:'录入、修改班级课程',
  manage:'管理教室/账号/角色权限'
};
async function boot(){
  const code = currentCode();
  const role = code ? await getRoleByCode(code) : null;
  if(role){ try{ sessionStorage.setItem('sched_role', JSON.stringify(role)); }catch(e){} }  // 全站共享身份

  if(!role){
    // 无 code 或无效：极简提示，无任何入口
    el('nav').innerHTML = '';
    el('empty').classList.remove('hidden');
    return;
  }

  el('nav').innerHTML = renderNav('index.html', role);
  el('hello').innerHTML = `<div class="tip">你好，<b>${esc(role.label||role.role||'')}</b>。以下是你可用的功能。</div>`;
  const ps = permSet(role);
  await renderAlerts(ps);

  // admin 专属功能（排教室/批准/会议安排/冲突/账号权限）只在 admin 后台做，不出现在 index 分发板
  const ADMIN_ONLY = new Set(['assign','approve','meeting_arrange','conflict','manage']);
  const seen=new Set(); const list=[];
  PERM_DEFS.forEach(([perm])=>{ if(!ps.has(perm)) return;
    if(ADMIN_ONLY.has(perm)) return;
    const key=(perm==='entry_room_full')?'entry_room':perm;
    if(seen.has(key)) return; seen.add(key); list.push(perm); });
  renderHub(list, code);
  el('hubWrap').classList.remove('hidden');
}
function renderHub(perms, code){
  const kq = code?('?k='+encodeURIComponent(code)):'';
  const pageOf = p => (PERM_DEFS.find(x=>x[0]===p)||[])[2] || 'index.html';
  let h='';
  perms.forEach(p=>{
    const page = pageOf(p);
    const href = page.includes('?') ? page+(code?('&k='+encodeURIComponent(code)):'') : page.split('?')[0]+kq;
    h += `<a href="${href}"><b>${ICON[p]||'•'} ${PERM_LABEL[p]||p}</b><span>${DESC[p]||''}</span></a>`;
  });
  el('hub').innerHTML = h || '<span class="muted">暂无可用功能，请联系管理员。</span>';
}
async function renderAlerts(ps){
  const box=el('alerts'); let cards=[];
  if(ps.has('approve')){
    try{
      const rows = await sbGet('sched_bookings','select=id&status=eq.pending');
      const n = rows.length;
      cards.push(`<a href="admin.html?tab=pending" class="alert-card"><b>✅ 待批准预约</b><span>${n>0?('有 '+n+' 条待处理'):'暂无待处理'}</span></a>`);
    }catch(e){}
  }
  box.innerHTML = cards.length ? ('<div class="hub" style="margin-bottom:14px">'+cards.join('')+'</div>') : '';
}
boot();
</script>
</body></html>
