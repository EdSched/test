<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>教室看板 · 唯新</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="nav"></div>
<div class="wrap">
  <div class="card">
    <div class="row">
      <div class="field"><label>校区</label><select id="campus"></select></div>
      <div class="field"><label>日期</label><input type="date" id="date"></div>
      <div class="field"><label>&nbsp;</label><button class="ghost sm" id="prev">◀ 前一天</button></div>
      <div class="field"><label>&nbsp;</label><button class="ghost sm" id="next">后一天 ▶</button></div>
      <div class="field" style="margin-left:auto"><label>&nbsp;</label>
        <span class="muted" id="meta"></span></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--course)"></i>排课</span>
      <span><i style="background:var(--vip)"></i>VIP</span>
      <span><i style="background:var(--temp)"></i>临时使用</span>
      <span><i style="background:var(--rental)"></i>对外出租</span>
      <span><i style="background:var(--meeting)"></i>开会</span>
      <span class="mic">📶 = 同时占用会议账号</span>
    </div>
  </div>
  <div class="card board" id="boardBox"><div class="muted">加载中…</div></div>
</div>

<script src="common.js"></script>
<script>
el('nav').innerHTML = renderNav('board.html');
let ROOMS=[], BOOKINGS=[];

async function boot(){
  fillSelect(el('campus'), CAMPUSES);
  el('date').value = todayStr();
  el('campus').onchange = render;
  el('date').onchange = render;
  el('prev').onclick = ()=>shiftDay(-1);
  el('next').onclick = ()=>shiftDay(1);
  try{
    ROOMS    = await sbGet('sched_rooms','select=*&active=eq.true&order=campus,sort');
    BOOKINGS = await sbGet('sched_bookings','select=*');
    render();
  }catch(e){ el('boardBox').innerHTML = '<div class="b-err badge">'+esc(e.message)+'</div>'; }
}
function shiftDay(n){
  const d=new Date(el('date').value+'T00:00:00'); d.setDate(d.getDate()+n);
  el('date').value = d.toISOString().slice(0,10); render();
}

function render(){
  const campus = el('campus').value, date = el('date').value;
  const rooms = ROOMS.filter(r => r.campus===campus);
  el('meta').textContent = WEEKDAYS[weekdayOf(date)] + ' · ' + rooms.length + ' 间教室';

  // 当天生效的占用（含 pending，pending 用虚线区分）
  const todays = BOOKINGS.filter(b => bookingOnDate(b, date));

  let h = '<table><thead><tr><th class="tcol">时段</th>';
  rooms.forEach(r => h += `<th>${esc(r.name)}<br><small class="muted">${r.type==='大课'?(r.size_label+'·'+r.capacity+'人'):(r.capacity+'人')}</small></th>`);
  h += '</tr></thead><tbody>';

  SLOTS.forEach(slot => {
    const sEnd = slotEnd(slot);
    h += `<tr><td class="tcol">${slot}</td>`;
    rooms.forEach(r => {
      // 找到在此教室、此 30 分格“开始”的占用块（只在起始格画，避免重复）
      const starting = todays.filter(b => String(b.room_id)===String(r.id) && b.start_time===slot);
      h += '<td class="cell">';
      starting.forEach(b => {
        const rows = spanRows(b.start_time, b.end_time);
        const pend = b.status==='pending';
        h += `<div class="blk ${KIND_CLASS[b.kind]||''}" style="height:${rows*22-3}px;${pend?'border:1px dashed #d93025;opacity:.85':''}">`
          + `${esc(b.title||KIND_LABEL[b.kind]||'')} ${b.uses_meeting?'<span class="mic">📶</span>':''}`
          + `<small>${esc(b.user_name||'')} ${b.start_time}-${b.end_time}${pend?' · 待确认':''}</small></div>`;
      });
      h += '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  el('boardBox').innerHTML = h;
}
function spanRows(s,e){ // 跨多少个 30 分格
  const idx = t => SLOTS.indexOf(t);
  let a=idx(s), b=idx(e); if(b<0) b=SLOTS.length; if(a<0) a=0;
  return Math.max(1, b-a);
}
boot();
</script>
</body></html>
