<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据录入 · 唯新</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="nav"></div>
<div class="wrap">

  <div id="gate" class="gate card">
    <h3>录入口令</h3>
    <p class="muted" style="font-size:13px">请输入管理员发放的录入口令</p>
    <input id="code" placeholder="口令" style="width:100%;margin-bottom:10px">
    <button id="enter" style="width:100%">进入</button>
    <p id="gerr" class="b-err badge hidden" style="margin-top:10px"></p>
  </div>

  <div id="main" class="hidden">
    <div class="tip">已进入录入模式（<span id="who"></span>）。你录入的内容将直接生效；公开预约需管理员确认。</div>
    <div class="tabs">
      <button class="on" data-t="course">课程录入</button>
      <button data-t="room">教室占用录入</button>
      <button data-t="mine">我最近录入的</button>
    </div>

    <!-- 课程录入 -->
    <div id="tab-course" class="card">
      <div style="border:1px dashed #cfe0ff;background:#f7faff;border-radius:8px;padding:12px;margin-bottom:14px">
        <b>📥 Excel 批量导入</b>
        <span class="muted" style="font-size:12px;margin-left:6px">按模板表头填好后上传，可预览后再确认导入。</span>
        <div class="row" style="margin-top:8px">
          <div class="field"><label>选择 Excel 文件</label><input type="file" id="xlsxFile" accept=".xlsx,.xls"></div>
          <div class="field"><label>&nbsp;</label><button class="ghost" id="xlsxParse">解析预览</button></div>
        </div>
        <div id="xlsxPrev" style="margin-top:10px"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>校区</label><select id="c_campus"></select></div>
        <div class="field"><label>类别（专业）</label><select id="c_cat"></select></div>
        <div class="field"><label>课程名</label><input id="c_name" placeholder="如 日语中级班N4"></div>
        <div class="field"><label>讲师</label><input id="c_teacher"></div>
        <div class="field" style="grid-column:1/-1"><label>周几（可多选，如每周二+周四）</label>
          <div id="c_wd" style="display:flex;gap:6px;flex-wrap:wrap"></div></div>
        <div class="field"><label>授课方式</label><select id="c_mode"><option>线下</option><option>线上</option></select></div>
        <div class="field"><label>开始时间</label><select id="c_st"></select></div>
        <div class="field"><label>结束时间</label><select id="c_et"></select></div>
        <div class="field"><label>开课日</label><input type="date" id="c_sd"></div>
        <div class="field"><label>结课日</label><input type="date" id="c_ed"></div>
        <div class="field"><label>回数</label><input type="number" id="c_sess" min="1"></div>
        <div class="field"><label>预估人数</label><input type="number" id="c_est" min="1" placeholder="用于安排教室"></div>
      </div>
      <div class="field" style="margin-top:10px"><label>腾讯会议链接（线上课/直播填）</label><input id="c_link" style="width:100%"></div>
      <div style="margin-top:12px"><button id="c_save">保存课程</button>
        <span class="muted" style="font-size:12px;margin-left:8px">课程不绑教室，只到校区+人数；教室由管理员按容量安排。</span></div>
    </div>

    <!-- 教室占用录入 -->
    <div id="tab-room" class="card hidden">
      <div class="grid2">
        <div class="field"><label>用途</label><select id="r_kind">
          <option value="temp">临时使用</option><option value="rental">对外出租</option>
          <option value="meeting">纯开会（借账号）</option></select></div>
        <div class="field"><label>重复方式</label><select id="r_rec">
          <option value="once">单次（某一天）</option><option value="weekly">每周（一段日期内）</option></select></div>
        <div class="field"><label>校区</label><select id="r_campus"></select></div>
        <div class="field"><label>教室</label><select id="r_room"></select></div>
        <div class="field" id="r_dateWrap"><label>日期</label><input type="date" id="r_date"></div>
        <div class="field hidden" id="r_sdWrap"><label>开始日期</label><input type="date" id="r_sd"></div>
        <div class="field hidden" id="r_edWrap"><label>结束日期</label><input type="date" id="r_ed"></div>
        <div class="field"><label>开始时间</label><select id="r_st"></select></div>
        <div class="field"><label>结束时间</label><select id="r_et"></select></div>
        <div class="field"><label>使用人/单位</label><input id="r_user"></div>
        <div class="field"><label>是否占用会议账号</label><select id="r_um">
          <option value="false">否（教室真正空出账号，可借他人开会）</option>
          <option value="true">是（占用该教室会议账号）</option></select></div>
      </div>
      <div class="field hidden" id="r_wdWrap" style="margin-top:10px"><label>每周几（可多选）</label>
        <div id="r_wd" style="display:flex;gap:6px;flex-wrap:wrap"></div></div>
      <div class="field hidden" id="r_accWrap" style="margin-top:10px"><label>会议账号</label><div id="r_accBox"></div></div>
      <div class="field" style="margin-top:10px"><label>备注</label><input id="r_note" style="width:100%"></div>
      <div id="r_conf" class="hidden" style="margin-top:10px"></div>
      <div id="r_near" style="margin-top:8px"></div>
      <div style="margin-top:12px"><button id="r_save">保存占用</button></div>
    </div>

    <!-- 我的记录 -->
    <div id="tab-mine" class="card hidden">
      <div class="row" style="margin-bottom:10px">
        <div class="field"><label>你的名字（用于筛选自己的记录）</label><input id="m_name"></div>
        <div class="field"><label>&nbsp;</label><button class="ghost sm" id="m_load">刷新</button></div>
      </div>
      <div id="mineBox" class="muted">输入名字后点刷新</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="common.js"></script>
<script>
el('nav').innerHTML = renderNav('entry.html');
let ROOMS=[], ACCOUNTS=[], BOOKINGS=[], CODEREC=null, PARSED=[];

/* 口令 */
el('enter').onclick = doEnter;
el('code').addEventListener('keydown', e=>{ if(e.key==='Enter') doEnter(); });
async function doEnter(){
  const code = el('code').value.trim();
  if(!code) return;
  try{
    const rec = await checkCode(code, 'entry');
    if(!rec){ el('gerr').textContent='口令无效'; el('gerr').classList.remove('hidden'); return; }
    CODEREC = rec;
    el('gate').classList.add('hidden'); el('main').classList.remove('hidden');
    el('who').textContent = rec.label || rec.scope || '录入员';
    await boot();
  }catch(e){ el('gerr').textContent=e.message; el('gerr').classList.remove('hidden'); }
}

/* tabs */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['course','room','mine'].forEach(t=>el('tab-'+t).classList.toggle('hidden', t!==b.dataset.t));
});

async function boot(){
  fillSelect(el('c_campus'), CAMPUSES);
  fillSelect(el('c_cat'), CATEGORIES);
  renderWeekdayToggle();
  fillSelect(el('c_st'), SLOTS); fillSelect(el('c_et'), SLOTS);
  fillSelect(el('r_campus'), CAMPUSES);
  fillSelect(el('r_st'), SLOTS); fillSelect(el('r_et'), SLOTS);
  el('r_date').value = todayStr();

  ROOMS    = await sbGet('sched_rooms','select=*&active=eq.true&order=campus,sort');
  ACCOUNTS = await sbGet('sched_meeting_accounts','select=*&active=eq.true');
  BOOKINGS = await sbGet('sched_bookings','select=*');

  el('r_campus').onchange = fillRooms; fillRooms();
  renderRoomWeekdayToggle();
  el('r_rec').onchange = onRecChange; onRecChange();
  el('r_um').onchange = refreshRoomAcc;
  ['r_room','r_date','r_sd','r_ed','r_st','r_et'].forEach(id=>el(id).onchange=()=>{ checkRoomConflict(); refreshRoomAcc(); });

  el('c_save').onclick = saveCourse;
  el('r_save').onclick = saveRoom;
  el('m_load').onclick = loadMine;
  el('xlsxParse').onclick = parseXlsx;
}
function onRecChange(){
  const weekly = el('r_rec').value==='weekly';
  el('r_dateWrap').classList.toggle('hidden', weekly);
  el('r_sdWrap').classList.toggle('hidden', !weekly);
  el('r_edWrap').classList.toggle('hidden', !weekly);
  el('r_wdWrap').classList.toggle('hidden', !weekly);
  checkRoomConflict();
}
function renderRoomWeekdayToggle(){
  const box=el('r_wd'); box.innerHTML='';
  for(let d=1; d<=7; d++){ const b=document.createElement('button');
    b.type='button'; b.className='ghost sm'; b.textContent=WEEKDAYS[d]; b.dataset.d=d;
    b.onclick=()=>{ const on=b.dataset.on==='1'; b.dataset.on=on?'':'1';
      b.style.background=on?'#fff':'var(--blue)'; b.style.color=on?'var(--ink)':'#fff'; checkRoomConflict(); };
    box.appendChild(b); }
}
function roomSelectedWeekdays(){ return [...el('r_wd').querySelectorAll('button[data-on="1"]')].map(b=>Number(b.dataset.d)); }
/* 账号自动绑定：默认教室固定账号，冲突才提示改临时 */
function refreshRoomAcc(){
  const um=el('r_um').value==='true';
  el('r_accWrap').classList.toggle('hidden', !um);
  if(!um){ el('r_accBox').innerHTML=''; return; }
  const r=ROOMS.find(x=>String(x.id)===String(el('r_room').value));
  const bound=r?r.meeting_account_id:null;
  const temps=ACCOUNTS.filter(a=>a.kind==='临时');
  let chosen = bound || (temps[0]&&temps[0].id);
  const date=el('r_rec').value==='weekly'? (el('r_sd').value||todayStr()) : el('r_date').value;
  const s=el('r_st').value, e=el('r_et').value;
  const conf = (date&&s&&e&&e>s)? accountConflicts(BOOKINGS, chosen, date, s, e, null) : [];
  if(conf.length){
    el('r_accBox').innerHTML='<div class="badge b-err" style="margin-bottom:6px">该教室固定账号此时段已被占用，请改用临时账号</div>'+
      '<select id="r_acc">'+temps.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')+'</select>';
  }else{
    el('r_accBox').innerHTML='<div>'+esc((ACCOUNTS.find(a=>String(a.id)===String(chosen))||{}).name||'—')+' <span class="badge b-ok">自动绑定</span></div>'+
      '<input type="hidden" id="r_acc" value="'+(chosen||'')+'">';
  }
}

/* ===== Excel 批量导入 ===== */
function normTime(t){ // "18-21" / "18:00-21:00" -> ["18:00","21:00"]
  if(!t) return [null,null];
  const parts = String(t).replace(/：/g,':').replace(/\s/g,'').split(/[-~—]/);
  const fix = x => { if(!x) return null; if(x.indexOf(':')<0) x=x+':00';
    const [h,m]=x.split(':'); return String(h).padStart(2,'0')+':'+String(m||'00').padStart(2,'0'); };
  return [fix(parts[0]), fix(parts[1])];
}
function normDate(v){ // Excel 日期/字符串 -> YYYY-MM-DD
  if(!v) return null;
  if(v instanceof Date) return v.toISOString().slice(0,10);
  const s=String(v).trim().replace(/\//g,'-');
  const m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  return null;
}
function parseXlsx(){
  const f = el('xlsxFile').files[0];
  if(!f){ toast('请先选择文件', false); return; }
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      PARSED = rows.map(r=>{
        const campus=String(r['校区']||'').trim();
        const [st,et]=normTime(r['上课时间']);
        let mode=String(r['授课方式']||'').trim();
        if(!mode) mode = campus.indexOf('线上')>=0 ? '线上' : '线下';
        return {
          campus, category:String(r['类别']||'').trim(), name:String(r['课程名']||'').trim(),
          teacher:String(r['讲师']||'').trim()||null,
          weekdays: parseWeekdays(r['周几']).join(','),
          start_time:st, end_time:et,
          start_date:normDate(r['开课日']), end_date:normDate(r['结课日']),
          term: termOf(normDate(r['开课日'])),
          sessions: r['回数']!==''?Number(r['回数']):null,
          est_students: r['预估人数']!==''?Number(r['预估人数']):null,
          mode, meeting_link:String(r['腾讯会议链接']||'').trim()||null,
          confirmed:true, note:null
        };
      });
      renderPrev();
    }catch(err){ toast('解析失败：'+err.message, false); }
  };
  reader.readAsArrayBuffer(f);
}
function rowErr(r){
  const e=[];
  if(!r.name) e.push('缺课程名');
  if(!CATEGORIES.includes(r.category)) e.push('类别不在允许范围');
  if(!r.weekdays) e.push('周几无法识别');
  if(!r.start_time||!r.end_time) e.push('时间无法识别');
  else if(r.end_time<=r.start_time) e.push('结束早于开始');
  return e;
}
function renderPrev(){
  if(!PARSED.length){ el('xlsxPrev').innerHTML='<span class="muted">未读到数据行</span>'; return; }
  let ok=0, bad=0;
  let h='<table><thead><tr><th>#</th><th>校区</th><th>类别</th><th>课程名</th><th>讲师</th><th>周几</th><th>时段</th><th>起止</th><th>回数</th><th>人数</th><th>方式</th><th>校验</th></tr></thead><tbody>';
  PARSED.forEach((r,i)=>{
    const errs=rowErr(r); if(errs.length) bad++; else ok++;
    h+=`<tr${errs.length?' style="background:#fff5f5"':''}><td>${i+1}</td><td>${esc(r.campus)}</td><td>${esc(r.category)}</td>`+
      `<td>${esc(r.name)}</td><td>${esc(r.teacher||'')}</td><td>${r.weekdays?weekdaysLabel(r.weekdays):'?'}</td>`+
      `<td>${r.start_time||'?'}-${r.end_time||'?'}</td><td>${r.start_date||''}~${r.end_date||''}</td>`+
      `<td>${r.sessions??''}</td><td>${r.est_students??''}</td><td>${esc(r.mode)}</td>`+
      `<td>${errs.length?'<span class="badge b-err">'+errs.join('；')+'</span>':'<span class="badge b-ok">OK</span>'}</td></tr>`;
  });
  h+='</tbody></table>';
  h+=`<div style="margin-top:10px"><b>${ok}</b> 行可导入，<b style="color:#d93025">${bad}</b> 行有问题。`+
     `<button id="xlsxImport" style="margin-left:10px"${ok?'':' disabled'}>确认导入 ${ok} 行</button>`+
     `<span class="muted" style="font-size:12px;margin-left:8px">有问题的行会跳过，可修正 Excel 后重新上传。</span></div>`;
  el('xlsxPrev').innerHTML=h;
  el('xlsxImport').onclick = doImport;
}
async function doImport(){
  const good = PARSED.filter(r=>rowErr(r).length===0);
  if(!good.length) return;
  el('xlsxImport').disabled=true; el('xlsxImport').textContent='导入中…';
  try{
    await sbInsert('sched_courses', good);
    toast('成功导入 '+good.length+' 门课程');
    el('xlsxPrev').innerHTML='<span class="badge b-ok">已导入 '+good.length+' 门，可到「学生课表」或管理后台查看。</span>';
    PARSED=[]; el('xlsxFile').value='';
  }catch(e){ toast('导入失败：'+e.message, false); el('xlsxImport').disabled=false; el('xlsxImport').textContent='重试导入'; }
}
function fillRooms(){
  const rs = ROOMS.filter(r=>r.campus===el('r_campus').value);
  fillSelect(el('r_room'), rs, r=>r.id, r=>r.name+'（'+r.capacity+'人）');
  checkRoomConflict();
  if(typeof refreshRoomAcc==='function') refreshRoomAcc();
}

/* 保存课程 */
/* 周几多选切换 */
function renderWeekdayToggle(){
  const box=el('c_wd'); box.innerHTML='';
  for(let d=1; d<=7; d++){
    const b=document.createElement('button');
    b.type='button'; b.className='ghost sm'; b.textContent=WEEKDAYS[d]; b.dataset.d=d;
    b.onclick=()=>{ const on=b.dataset.on==='1'; b.dataset.on=on?'':'1';
      b.style.background=on?'#fff':'var(--blue)'; b.style.color=on?'var(--ink)':'#fff'; };
    box.appendChild(b);
  }
}
function getSelectedWeekdays(){
  return [...el('c_wd').querySelectorAll('button[data-on="1"]')].map(b=>b.dataset.d).join(',');
}

async function saveCourse(){
  const rec = {
    campus: el('c_campus').value,
    category: el('c_cat').value, name: el('c_name').value.trim(),
    teacher: el('c_teacher').value.trim(), weekdays: getSelectedWeekdays(),
    start_time: el('c_st').value, end_time: el('c_et').value,
    start_date: el('c_sd').value||null, end_date: el('c_ed').value||null,
    term: termOf(el('c_sd').value),
    sessions: el('c_sess').value?Number(el('c_sess').value):null,
    est_students: el('c_est').value?Number(el('c_est').value):null,
    mode: el('c_mode').value, meeting_link: el('c_link').value.trim()||null,
    confirmed: true, note:null
  };
  if(!rec.name){ toast('请填课程名', false); return; }
  if(!rec.weekdays){ toast('请至少选择一个上课日', false); return; }
  if(rec.end_time <= rec.start_time){ toast('结束时间需晚于开始', false); return; }
  try{ await sbInsert('sched_courses', rec); toast('课程已保存');
    ['c_name','c_teacher','c_sess','c_est','c_link'].forEach(id=>el(id).value='');
    renderWeekdayToggle();
  }catch(e){ toast(e.message, false); }
}

/* 占用冲突提示 + 就近空档 */
function checkRoomConflict(){
  const box=el('r_conf'), nearBox=el('r_near');
  const roomId=el('r_room').value;
  const s=el('r_st').value, e=el('r_et').value;
  const weekly=el('r_rec').value==='weekly';
  nearBox.innerHTML='';
  if(!(roomId && s && e && e>s)){ box.className='hidden'; return; }
  let msgs=[], firstDate=null;
  if(weekly){
    const sd=el('r_sd').value, ed=el('r_ed').value, wds=roomSelectedWeekdays();
    if(sd && ed && wds.length){
      // 对区间内每个所选周几的首次出现日检测（近似）
      wds.forEach(wd=>{
        let d=sd; while(weekdayOf(d)!==wd && d<=ed) d=addDays(d,1);
        if(d<=ed){ const rc=roomConflicts(BOOKINGS, roomId, d, s, e, null);
          if(rc.length) msgs.push('⚠ '+WEEKDAYS[wd]+' 该时段已占：'+rc.map(x=>x.title||KIND_LABEL[x.kind]).join('、')); }
      });
    }
  }else{
    const date=el('r_date').value; firstDate=date;
    if(date){ const rc=roomConflicts(BOOKINGS, roomId, date, s, e, null);
      if(rc.length) msgs.push('⚠ 教室在该时段已被占用：'+rc.map(x=>x.title||KIND_LABEL[x.kind]).join('、')); }
  }
  if(msgs.length){
    box.className=''; box.innerHTML='<div class="b-err badge">'+msgs.join('<br>')+'</div>';
    // 单次冲突时给就近空档
    if(!weekly && firstDate){
      const nb=findNearby(BOOKINGS, roomId, firstDate, s, e, 5);
      let h='<div class="tip"><b>就近空档参考</b><div style="margin-top:4px">当天其他空时段：'+
        (nb.sameDay.length? nb.sameDay.map(t=>`<button class="ghost sm" data-pk="${firstDate}|${t}">${t}</button>`).join(' '):'无')+'</div>'+
        '<div style="margin-top:4px">同时段前后几天有空：'+
        (nb.nearDates.length? nb.nearDates.map(o=>`<button class="ghost sm" data-pk="${o.date}|${s}-${e}">${o.date}（${WEEKDAYS[weekdayOf(o.date)]}）</button>`).join(' '):'无')+'</div></div>';
      nearBox.innerHTML=h;
      nearBox.querySelectorAll('button[data-pk]').forEach(b=>b.onclick=()=>{
        const [d,tt]=b.dataset.pk.split('|'); const [ns,ne]=tt.split('-');
        el('r_date').value=d; el('r_st').value=ns; el('r_et').value=ne; checkRoomConflict(); refreshRoomAcc();
      });
    }
  } else box.className='hidden';
}
/* 保存占用 */
async function saveRoom(){
  const s=el('r_st').value, e=el('r_et').value;
  if(e<=s){ toast('结束时间需晚于开始', false); return; }
  if(!el('r_room').value){ toast('请选择教室', false); return; }
  const um = el('r_um').value==='true';
  const weekly = el('r_rec').value==='weekly';
  const base = {
    room_id: Number(el('r_room').value), kind: el('r_kind').value,
    title: KIND_LABEL[el('r_kind').value], user_name: el('r_user').value.trim(),
    start_time:s, end_time:e, uses_meeting: um,
    meeting_account_id: um ? Number(el('r_acc').value) : null,
    status:'confirmed', created_by: el('r_user').value.trim()||CODEREC.label,
    note: el('r_note').value.trim()||null
  };
  let recs=[];
  if(weekly){
    const sd=el('r_sd').value, ed=el('r_ed').value, wds=roomSelectedWeekdays();
    if(!sd||!ed){ toast('请填开始/结束日期', false); return; }
    if(!wds.length){ toast('请至少选一个周几', false); return; }
    recs = wds.map(wd=>Object.assign({}, base, {recurrence:'weekly', weekday:wd, start_date:sd, end_date:ed}));
  }else{
    if(!el('r_date').value){ toast('请填日期', false); return; }
    recs = [Object.assign({}, base, {recurrence:'once', booking_date:el('r_date').value})];
  }
  try{
    const ins = await sbInsert('sched_bookings', recs);
    ins.forEach(x=>BOOKINGS.push(x)); toast('占用已保存（'+ins.length+' 条）'); checkRoomConflict();
  }catch(err){ toast(err.message, false); }
}

/* 我的记录 */
async function loadMine(){
  const name=el('m_name').value.trim();
  if(!name){ el('mineBox').innerHTML='<span class="muted">请输入名字</span>'; return; }
  const rows = await sbGet('sched_bookings',
    'select=*&created_by=eq.'+encodeURIComponent(name)+'&order=created_at.desc&limit=50');
  if(!rows.length){ el('mineBox').innerHTML='<span class="muted">暂无记录</span>'; return; }
  const rmap={}; ROOMS.forEach(r=>rmap[r.id]=r.name);
  let h='<table><thead><tr><th>日期</th><th>教室</th><th>用途</th><th>时段</th><th>账号</th><th>状态</th></tr></thead><tbody>';
  rows.forEach(b=>{ h+=`<tr><td>${b.booking_date||''}</td><td>${esc(rmap[b.room_id]||'—')}</td>`+
    `<td>${KIND_LABEL[b.kind]}</td><td>${b.start_time}-${b.end_time}</td>`+
    `<td>${b.uses_meeting?'📶':''}</td><td>${b.status==='pending'?'<span class="badge b-warn">待确认</span>':'<span class="badge b-ok">已确认</span>'}</td></tr>`; });
  h+='</tbody></table>'; el('mineBox').innerHTML=h;
}
</script>
