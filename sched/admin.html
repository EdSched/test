<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台 · 唯新</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="nav"></div>
<div class="wrap">
  <div id="gate" class="gate card">
    <h3>管理员口令</h3>
    <input id="code" placeholder="口令" style="width:100%;margin-bottom:10px">
    <button id="enter" style="width:100%">进入</button>
    <p id="gerr" class="b-err badge hidden" style="margin-top:10px"></p>
  </div>

  <div id="main" class="hidden">
    <div class="tabs">
      <button class="on" data-t="pending">待确认预约 <span id="pendN" class="badge b-warn"></span></button>
      <button data-t="assign">排教室</button>
      <button data-t="conflict">冲突检查</button>
      <button data-t="occupy">教室占用</button>
      <button data-t="rooms">教室</button>
      <button data-t="accounts">会议账号</button>
      <button data-t="courses">课程</button>
      <button data-t="codes">角色权限</button>
    </div>
    <div id="panel"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
let ROOMS=[], ACCOUNTS=[], COURSES=[], BOOKINGS=[], CODES=[], ROLE=null;

/* 口令登录（口令即 access_codes 的 code，需 manage 权限）。admin-9527 可直接进 */
el('nav').innerHTML = renderNav('admin.html');
el('enter').onclick = doEnter;
el('code').addEventListener('keydown',e=>{ if(e.key==='Enter') doEnter(); });
async function doEnter(){
  const code=el('code').value.trim(); if(!code) return;
  try{
    const rec=await getRoleByCode(code);
    const ok = rec && (hasPerm(rec,'manage') || rec.role==='admin');
    if(!ok){ el('gerr').textContent='口令无效或非管理员'; el('gerr').classList.remove('hidden'); return; }
    ROLE=rec;
    el('gate').classList.add('hidden'); el('main').classList.remove('hidden');
    await reloadAll(); show('pending');
  }catch(e){ el('gerr').textContent=e.message; el('gerr').classList.remove('hidden'); }
}
async function reloadAll(){
  [ROOMS,ACCOUNTS,COURSES,BOOKINGS,CODES] = await Promise.all([
    sbGet('sched_rooms','select=*&order=campus,sort'),
    sbGet('sched_meeting_accounts','select=*&order=id'),
    sbGet('sched_courses','select=*&order=created_at.desc'),
    sbGet('sched_bookings','select=*&order=created_at.desc'),
    sbGet('sched_access_codes','select=*&order=id')
  ]);
  const pend=BOOKINGS.filter(b=>b.status==='pending').length;
  el('pendN').textContent = pend||''; el('pendN').style.display=pend?'':'none';
}
const rname=id=>{ const r=ROOMS.find(x=>String(x.id)===String(id)); return r?r.name:'—'; };
const aname=id=>{ const a=ACCOUNTS.find(x=>String(x.id)===String(id)); return a?a.name:'—'; };

/* tabs */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(t){
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  ({pending:tabPending,assign:tabAssign,conflict:tabConflict,occupy:tabOccupy,rooms:tabRooms,
    accounts:tabAccounts,courses:tabCourses,codes:tabCodes}[t])();
}

/* ---------- 待确认预约 ---------- */
function tabPending(){
  const list=BOOKINGS.filter(b=>b.status==='pending');
  let h='<div class="card"><h3 style="margin-top:2px">待确认预约</h3>';
  if(!list.length) h+='<div class="muted">没有待确认的预约</div>';
  else{ h+='<table><thead><tr><th>日期</th><th>教室</th><th>用途</th><th>时段</th><th>人</th><th>账号</th><th>冲突</th><th>操作</th></tr></thead><tbody>';
    list.forEach(b=>{
      const rc=roomConflicts(BOOKINGS,b.room_id,b.booking_date,b.start_time,b.end_time,b.id);
      const ac=b.uses_meeting?accountConflicts(BOOKINGS,b.meeting_account_id,b.booking_date,b.start_time,b.end_time,b.id):[];
      const bad=rc.length||ac.length;
      h+=`<tr><td>${b.booking_date||''}</td><td>${esc(rname(b.room_id))}</td><td>${esc(b.title||KIND_LABEL[b.kind])}</td>`+
        `<td>${b.start_time}-${b.end_time}</td><td>${esc(b.user_name||'')}</td><td>${b.uses_meeting?esc(aname(b.meeting_account_id)):'—'}</td>`+
        `<td>${bad?'<span class="badge b-err">有冲突</span>':'<span class="badge b-ok">无</span>'}</td>`+
        `<td><button class="sm" data-ok="${b.id}">确认</button> <button class="sm ghost" data-no="${b.id}">驳回</button></td></tr>`;
    });
    h+='</tbody></table>'; }
  h+='</div>'; render(h);
  bind('[data-ok]', async id=>{ await sbUpdate('sched_bookings',id,{status:'confirmed'}); await reloadAll(); show('pending'); toast('已确认'); });
  bind('[data-no]', async id=>{ if(confirm('驳回并删除该预约？')){ await sbDelete('sched_bookings',id); await reloadAll(); show('pending'); toast('已驳回'); } });
}

/* ---------- 排教室：课程 -> 生成 weekly 占用 ---------- */
function tabAssign(){
  let h='<div class="card"><h3 style="margin-top:2px">排教室（把课程分配到教室）</h3>'+
    '<div class="tip">线下课需分配容量足够的教室；纯线上课不占教室，只需指定会议账号。分配后自动生成整学期每周占用。</div>'+
    '<div class="row" style="margin-bottom:10px">'+
      '<div class="field"><label>搜索课程名/讲师</label><input id="af_q" placeholder="关键词"></div>'+
      '<div class="field"><label>期</label><select id="af_term"></select></div>'+
      '<div class="field"><label>类别（专业/学科）</label><select id="af_cat"></select></div>'+
      '<div class="field"><label>校区</label><select id="af_campus"></select></div>'+
      '<div class="field"><label>状态</label><select id="af_status">'+
        '<option value="">全部</option><option value="todo">未排</option><option value="done">已排</option></select></div>'+
      '<div class="field"><label>&nbsp;</label><span class="muted" id="af_count"></span></div>'+
    '</div><div id="assignTable"></div></div><div id="asForm"></div>';
  render(h);
  const terms=[...new Set(COURSES.map(c=>c.term).filter(Boolean))].sort().reverse();
  fillSelect(el('af_term'), terms, v=>v, v=>v, '全部期');
  if(terms.length) el('af_term').value=terms[0]; // 默认最新期，过去的期不显示
  fillSelect(el('af_cat'), CATEGORIES, v=>v, v=>v, '全部类别');
  fillSelect(el('af_campus'), ['高马','市谷','线上'], v=>v, v=>v, '全部校区');
  ['af_q','af_term','af_cat','af_campus','af_status'].forEach(id=>el(id)[id==='af_q'?'oninput':'onchange']=renderAssignTable);
  renderAssignTable();
}
function renderAssignTable(){
  const q=(el('af_q').value||'').trim().toLowerCase();
  const term=el('af_term').value, cat=el('af_cat').value, campus=el('af_campus').value, status=el('af_status').value;
  const assigned=new Set(BOOKINGS.filter(b=>b.kind==='course').map(b=>String(b.course_id)));
  let list=COURSES.filter(c=>{
    const done=assigned.has(String(c.id));
    if(q && !((c.name||'').toLowerCase().includes(q) || (c.teacher||'').toLowerCase().includes(q))) return false;
    if(term && c.term!==term) return false;
    if(cat && c.category!==cat) return false;
    if(campus && c.campus!==campus) return false;
    if(status==='todo' && done) return false;
    if(status==='done' && !done) return false;
    return true;
  });
  el('af_count').textContent = '共 '+list.length+' 门';
  let h='<table><thead><tr><th>课程</th><th>类别</th><th>校区</th><th>周几</th><th>时段</th><th>日期区间</th><th>人数</th><th>方式</th><th>已排</th><th>操作</th></tr></thead><tbody>';
  if(!list.length) h+='<tr><td colspan="10" class="muted">无匹配课程</td></tr>';
  list.forEach(c=>{
    const done=assigned.has(String(c.id));
    const myb=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(c.id));
    const where=myb.length?(myb[0].room_id?rname(myb[0].room_id):'线上')+(myb[0].uses_meeting?' 📶':''):'';
    const noDate = !c.start_date || !c.end_date;
    h+=`<tr><td>${esc(c.name)}<br><small class="muted">${esc(c.teacher||'')}</small></td><td>${esc(c.category)}</td><td>${esc(c.campus)}</td>`+
      `<td>${weekdaysLabel(c.weekdays)}</td><td>${c.start_time||''}-${c.end_time||''}</td>`+
      `<td>${noDate?'<span class="badge b-warn">缺日期</span>':(c.start_date+' ~ '+c.end_date)}</td>`+
      `<td>${c.est_students||'?'}</td><td>${esc(c.mode)}</td>`+
      `<td>${done?'<span class="badge b-ok">已排 · '+esc(where)+'</span>':'<span class="badge b-mute">未排</span>'}</td>`+
      `<td><button class="sm" data-as="${c.id}">${done?'重排':'排教室'}</button></td></tr>`;
  });
  h+='</tbody></table>';
  el('assignTable').innerHTML=h;
  bind('[data-as]', id=>assignForm(id));
}
function assignForm(courseId){
  const c=COURSES.find(x=>String(x.id)===String(courseId));
  const wdays=(c.weekdays||'').split(',').map(Number).filter(Boolean);
  const online=c.mode==='线上';
  const existing=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(c.id));
  const ex=existing[0]||null;  // 重排时回显
  function candList(allCampus){
    let list=ROOMS.filter(r=>r.active && (allCampus || r.campus===c.campus));
    if(c.est_students) list=list.filter(r=>r.capacity>=c.est_students);
    return list;
  }
  const roomFree=r=> wdays.every(wd => !BOOKINGS.some(b=>
      b.status!=='pending' && b.recurrence==='weekly' &&
      String(b.course_id)!==String(c.id) &&
      String(b.room_id)===String(r.id) && Number(b.weekday)===wd &&
      overlap(c.start_time,c.end_time,b.start_time,b.end_time) &&
      !(c.end_date&&b.start_date&&c.end_date<b.start_date) &&
      !(c.start_date&&b.end_date&&c.start_date>b.end_date) ));
  function roomOptions(allCampus){
    const cand=candList(allCampus);
    let o = cand.length? '' : '<option value="">无满足容量的教室</option>';
    cand.forEach(r=>{ const free=roomFree(r); const sel=ex&&String(ex.room_id)===String(r.id)?' selected':'';
      const camp = r.campus!==c.campus ? ('['+esc(r.campus)+'] ') : '';
      o+=`<option value="${r.id}"${(free||sel)?'':' disabled'}${sel}>${camp}${esc(r.name)}（${r.capacity}人）${free?'':' — 有上课日该时段已占'}</option>`; });
    return o;
  }
  let h='<div style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:40px 16px">'+
    '<div class="card" style="width:520px;max-width:94vw;margin:auto"><h3 style="margin-top:2px">'+(ex?'重排':'排')+'「'+esc(c.name)+'」教室</h3>'+
    `<div class="muted" style="margin-bottom:8px">${esc(c.campus)} · ${weekdaysLabel(c.weekdays)} · ${c.start_time}-${c.end_time} · 预估${c.est_students||'?'}人 · ${c.mode}</div>`;
  if(ex){ const exRoom=ex.room_id?rname(ex.room_id):'线上'; h+='<div class="tip">当前已排：<b>'+esc(exRoom)+'</b> · '+(ex.uses_meeting?('占用账号 '+esc(aname(ex.meeting_account_id))):'不占账号')+'。下面可调整后重新生成。</div>'; }
  const noDate = !c.start_date || !c.end_date;
  if(noDate){
    h+='<div class="tip">这门课缺开课/结课日期，排教室前请补上（会同时写回课程）。</div>'+
      '<div class="row"><div class="field"><label>开课日</label><input type="date" id="as_sd" value="'+(c.start_date||'')+'"></div>'+
      '<div class="field"><label>结课日</label><input type="date" id="as_ed" value="'+(c.end_date||'')+'"></div></div>';
  }else{
    h+=`<div class="field" style="margin-bottom:8px"><label>日期区间</label><div>${c.start_date} ~ ${c.end_date}</div></div>`;
  }
  if(!online){
    h+='<div class="field"><label>选择教室（仅列容量足够）</label><select id="as_room">'+roomOptions(false)+'</select></div>'+
      '<label style="font-size:12px;display:flex;align-items:center;gap:6px;margin-top:4px;cursor:pointer">'+
      '<input type="checkbox" id="as_all"> 显示其它校区/租借的教室（本校区教室不够时用）</label>';
  }
  const exUm = ex? ex.uses_meeting : online;
  h+='<div class="field" style="margin-top:8px"><label>是否占用会议账号'+(online?'（线上课必占）':'（线下直播才占）')+'</label>'+
    `<select id="as_um">${online?`<option value="true">是</option>`:`<option value="false"${exUm?'':' selected'}>否</option><option value="true"${exUm?' selected':''}>是</option>`}</select></div>`;
  // 账号：默认用教室固定账号，自动带出；冲突时才提示并允许改临时账号
  h+='<div class="field '+((online||exUm)?'':'hidden')+'" id="as_accWrap" style="margin-top:8px"><label>会议账号</label><div id="as_accBox"></div></div>';
  h+='<div id="as_warn" class="hidden" style="margin-top:8px"></div>';
  h+='<div style="margin-top:12px"><button id="as_do">生成占用</button> <button class="ghost" id="as_cancel">取消</button></div></div></div>';
  el('asForm').innerHTML=h;
  el('as_cancel').onclick=()=>el('asForm').innerHTML='';

  function acctConflictDays(accId, sd, ed){
    return wdays.filter(wd => BOOKINGS.some(b=>
      b.status!=='pending' && b.uses_meeting && String(b.meeting_account_id)===String(accId) &&
      String(b.course_id)!==String(c.id) && b.recurrence==='weekly' && Number(b.weekday)===wd &&
      overlap(c.start_time,c.end_time,b.start_time,b.end_time) &&
      !(ed&&b.start_date&&ed<b.start_date) && !(sd&&b.end_date&&sd>b.end_date) ));
  }
  function refreshAcc(){
    const um = online ? true : el('as_um').value==='true';
    el('as_accWrap').classList.toggle('hidden', !um);
    if(!um){ el('as_accBox').innerHTML=''; return; }
    const sd = noDate ? (el('as_sd')?.value||c.start_date) : c.start_date;
    const ed = noDate ? (el('as_ed')?.value||c.end_date) : c.end_date;
    if(online){
      // 线上课：手动从“有账号的教室账号”里挑（+临时账号），标各账号该时段空/占
      const roomAccs = ACCOUNTS.filter(a=>a.kind==='固定' && a.account_no).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      const tempAccs = ACCOUNTS.filter(a=>a.kind==='临时');
      const cand = roomAccs.concat(tempAccs);
      const cur = (ex&&ex.meeting_account_id) || (cand[0]&&cand[0].id);
      const opt = a=>{ const busy=acctConflictDays(a.id,sd,ed).length>0;
        return `<option value="${a.id}"${String(cur)===String(a.id)?' selected':''}${busy?' disabled':''}>${esc(a.name)}${busy?'（该时段已占）':'（空闲）'}</option>`; };
      el('as_accBox').innerHTML='<div class="muted" style="font-size:12px;margin-bottom:4px">线上课需手动指定腾讯账号（用对应教室的账号）：</div>'+
        '<select id="as_acc">'+cand.map(opt).join('')+'</select>';
      return;
    }
    // 线下课：教室固定账号自动绑定，冲突才改临时
    const r=ROOMS.find(x=>String(x.id)===String(el('as_room').value));
    const boundAcc = r?r.meeting_account_id:null;
    const tempAccs=ACCOUNTS.filter(a=>a.kind==='临时');
    let chosen = (ex&&ex.meeting_account_id) || boundAcc || (tempAccs[0]&&tempAccs[0].id);
    const conflictDays = acctConflictDays(chosen, sd, ed);
    if(conflictDays.length){
      el('as_accBox').innerHTML='<div class="badge b-err" style="margin-bottom:6px">固定账号 '+esc(aname(boundAcc))+' 在 '+conflictDays.map(d=>WEEKDAYS[d]).join('/')+' 该时段已被占用，请改用临时账号</div>'+
        '<select id="as_acc">'+tempAccs.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')+'</select>';
    }else{
      el('as_accBox').innerHTML='<div>'+esc(aname(chosen))+' <span class="badge b-ok">自动绑定</span></div>'+
        '<input type="hidden" id="as_acc" value="'+chosen+'">';
    }
  }
  if(!online){ el('as_um').onchange=refreshAcc; el('as_room').onchange=refreshAcc;
    el('as_all').onchange=()=>{ el('as_room').innerHTML=roomOptions(el('as_all').checked); refreshAcc(); }; }
  refreshAcc();

  el('as_do').onclick=async()=>{
    const um = online ? true : el('as_um').value==='true';
    const roomId = online ? null : Number(el('as_room').value);
    if(!online && !roomId){ el('as_warn').className=''; el('as_warn').innerHTML='<span class="badge b-err">请选择教室</span>'; return; }
    let sd=c.start_date, ed=c.end_date;
    if(noDate){ sd=el('as_sd').value||null; ed=el('as_ed').value||null;
      if(!sd||!ed){ el('as_warn').className=''; el('as_warn').innerHTML='<span class="badge b-err">请补齐开课/结课日期</span>'; return; } }
    const accId = um ? Number(el('as_acc').value) : null;
    const recs = wdays.map(wd=>({ room_id:roomId, kind:'course', course_id:c.id,
      title:c.name, user_name:c.teacher||null, recurrence:'weekly', weekday:wd,
      start_date:sd, end_date:ed, start_time:c.start_time, end_time:c.end_time,
      uses_meeting:um, meeting_account_id:accId,
      status:'confirmed', created_by:'admin', note:'排课自动生成' }));
    try{
      if(noDate) await sbUpdate('sched_courses', c.id, {start_date:sd, end_date:ed});
      for(const o of existing) await sbDelete('sched_bookings',o.id);
      await sbInsert('sched_bookings',recs);
      await reloadAll();
      if(el('assignTable')) renderAssignTable();
      if(um){ meetingLinkStep(c, accId); }   // 占账号 → 进入设定会议链接步骤
      else { el('asForm').innerHTML=''; toast('已生成整学期占用（'+recs.length+' 天/周）'); }
    }catch(e){ el('as_warn').className=''; el('as_warn').innerHTML='<span class="badge b-err">'+esc(e.message)+'</span>'; }
  };
}
/* 排完教室后：粘贴腾讯会议文字，解析并回填链接/会议号 */
function meetingLinkStep(c, accId){
  const acc = ACCOUNTS.find(a=>String(a.id)===String(accId));
  let h='<div style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:40px 16px">'+
    '<div class="card" style="width:560px;max-width:94vw;margin:auto"><h3 style="margin-top:2px">设定会议链接 · 「'+esc(c.name)+'」</h3>'+
    '<div class="tip">已排好教室、账号'+(acc?('：<b>'+esc(acc.name)+'</b>'):'')+'。把<b>腾讯会议 App 生成的邀请文字</b>整段粘贴进来，自动读出链接、会议号、时间。</div>'+
    '<div class="field"><label>腾讯会议邀请文字</label><textarea id="mk_txt" rows="7" placeholder="会议主题：...\n会议时间：2026/07/12 16:00-18:00 ...\n重复周期：2026/07/12-2026/09/13 ... 每周 (周日)\n点击链接入会：https://meeting.tencent.com/dm/xxxx\n#腾讯会议：537-7181-4387"></textarea></div>'+
    '<div><button class="ghost sm" id="mk_parse">解析</button></div>'+
    '<div id="mk_prev" style="margin-top:8px"></div>'+
    '<div id="mk_warn" class="hidden" style="margin-top:8px"></div>'+
    '<div style="margin-top:12px"><button id="mk_save" disabled>保存会议信息</button> <button class="ghost" id="mk_skip">暂不设定</button></div>'+
    '</div></div>';
  el('asForm').innerHTML=h;
  let parsed=null;
  el('mk_skip').onclick=()=>{ el('asForm').innerHTML=''; toast('教室已排（会议链接稍后可在课程编辑里补）'); };
  el('mk_parse').onclick=()=>{
    parsed=parseTencent(el('mk_txt').value);
    if(!parsed.link && !parsed.id){ el('mk_prev').innerHTML='<span class="badge b-err">没识别到腾讯链接或会议号，请检查粘贴内容</span>'; el('mk_save').disabled=true; return; }
    el('mk_prev').innerHTML='<table><tbody>'+
      `<tr><td class="muted">会议链接</td><td>${parsed.link?esc(parsed.link):'<span class="muted">—</span>'}</td></tr>`+
      `<tr><td class="muted">会议号</td><td>${parsed.id?esc(parsed.id):'<span class="muted">—</span>'}</td></tr>`+
      `<tr><td class="muted">时段</td><td>${parsed.start_time?parsed.start_time+'-'+parsed.end_time:'<span class="muted">—</span>'}</td></tr>`+
      `<tr><td class="muted">周期</td><td>${parsed.start_date?(parsed.start_date+' ~ '+(parsed.end_date||'?')):'<span class="muted">—</span>'}${parsed.weekday?(' 每周'+WEEKDAYS[parsed.weekday]):''}</td></tr>`+
      '</tbody></table>';
    // 时段/周几与课程不一致时给个提示
    const warn=[];
    if(parsed.start_time && parsed.start_time!==c.start_time) warn.push('腾讯时段('+parsed.start_time+')与课程('+c.start_time+')不一致');
    if(parsed.weekday && c.weekdays && !c.weekdays.split(',').map(Number).includes(parsed.weekday)) warn.push('腾讯周几(周'+WEEKDAYS[parsed.weekday]+')不在课程上课日内');
    el('mk_prev').innerHTML += warn.length?('<div class="badge b-warn" style="margin-top:6px">⚠ '+warn.join('；')+'（仍可保存，仅提醒）</div>'):'';
    el('mk_save').disabled=false;
  };
  el('mk_save').onclick=async()=>{
    if(!parsed) return;
    try{
      await sbUpdate('sched_courses', c.id, { meeting_link:parsed.link||null, meeting_id:parsed.id||null });
      await reloadAll(); if(el('assignTable')) renderAssignTable();
      el('asForm').innerHTML=''; toast('会议信息已保存，学生课表可点链接');
    }catch(e){ el('mk_warn').className=''; el('mk_warn').innerHTML='<span class="badge b-err">'+esc(e.message)+'</span>'; }
  };
}

/* ---------- 冲突检查 ---------- */
function tabConflict(){
  let h='<div class="card"><h3 style="margin-top:2px">冲突检查</h3>'+
    '<div class="row"><div class="field"><label>检查日期</label><input type="date" id="cf_date" value="'+todayStr()+'"></div>'+
    '<div class="field"><label>&nbsp;</label><button id="cf_go">检查</button></div></div><div id="cf_res" style="margin-top:10px"></div></div>';
  render(h);
  el('cf_go').onclick=runConflict; runConflict();
}
function runConflict(){
  const date=el('cf_date').value;
  const active=BOOKINGS.filter(b=>b.status!=='pending' && bookingOnDate(b,date));
  const roomIssues=[], accIssues=[];
  for(let i=0;i<active.length;i++) for(let j=i+1;j<active.length;j++){
    const a=active[i],b=active[j];
    if(!overlap(a.start_time,a.end_time,b.start_time,b.end_time)) continue;
    if(a.room_id&&b.room_id&&String(a.room_id)===String(b.room_id))
      roomIssues.push([a,b,rname(a.room_id)]);
    if(a.uses_meeting&&b.uses_meeting&&String(a.meeting_account_id)===String(b.meeting_account_id)&&a.meeting_account_id)
      accIssues.push([a,b,aname(a.meeting_account_id)]);
  }
  const line=(a,b,label,type)=>`<tr><td>${esc(label)}</td><td>${esc(a.title||KIND_LABEL[a.kind])} ${a.start_time}-${a.end_time}</td><td>${esc(b.title||KIND_LABEL[b.kind])} ${b.start_time}-${b.end_time}</td></tr>`;
  let h=`<div class="muted">${WEEKDAYS[weekdayOf(date)]} ${date}</div>`;
  h+='<h4 style="margin:10px 0 4px">教室冲突</h4>';
  h+= roomIssues.length? '<table><thead><tr><th>教室</th><th>占用A</th><th>占用B</th></tr></thead><tbody>'+roomIssues.map(x=>line(...x)).join('')+'</tbody></table>'
    : '<div class="badge b-ok">无教室冲突</div>';
  h+='<h4 style="margin:14px 0 4px">会议账号冲突</h4>';
  h+= accIssues.length? '<table><thead><tr><th>账号</th><th>占用A</th><th>占用B</th></tr></thead><tbody>'+accIssues.map(x=>line(...x)).join('')+'</tbody></table>'
    : '<div class="badge b-ok">无账号冲突</div>';
  el('cf_res').innerHTML=h;
}

  ['oc_kind','oc_campus','oc_from','oc_q'].forEach(id=>el(id)[id==='oc_q'?'oninput':'onchange']=renderOccupyTable);
  renderOccupyTable();

function renderOccupyTable(){
  const kind=el('oc_kind').value, campus=el('oc_campus').value, from=el('oc_from').value, q=(el('oc_q').value||'').trim().toLowerCase();
  const rmap={}; ROOMS.forEach(r=>rmap[r.id]=r);
  let list=BOOKINGS.filter(b=>b.kind!=='course').filter(b=>{
    if(kind && b.kind!==kind) return false;
    if(campus){ const r=rmap[b.room_id]; if(!r||r.campus!==campus) return false; }
    // 日期：once 看 booking_date；weekly 看 end_date 是否在 from 之后
    if(from){ const d = b.recurrence==='weekly'? (b.end_date||b.start_date) : b.booking_date; if(d && d<from) return false; }
    if(q && !((b.user_name||'').toLowerCase().includes(q)||(b.note||'').toLowerCase().includes(q)||(b.created_by||'').toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b)=>{
    const da=a.booking_date||a.start_date||'', db=b.booking_date||b.start_date||''; return da.localeCompare(db);
  });
  el('oc_count').textContent='共 '+list.length+' 条';
  let h='<table><thead><tr><th>用途</th><th>校区</th><th>教室</th><th>日期/周期</th><th>时段</th><th>使用人</th><th>账号</th><th>状态</th><th>备注</th><th></th></tr></thead><tbody>';
  if(!list.length) h+='<tr><td colspan="10" class="muted">无匹配记录</td></tr>';
  list.forEach(b=>{
    const r=rmap[b.room_id];
    const when = b.recurrence==='weekly'
      ? (weekdaysLabel(String(b.weekday))+' '+(b.start_date||'')+'~'+(b.end_date||''))
      : (b.booking_date||'');
    h+=`<tr><td>${KIND_LABEL[b.kind]||esc(b.kind)}</td><td>${esc(r?r.campus:'')}</td><td>${esc(r?r.name:(b.room_id?('#'+b.room_id):'—'))}</td>`+
      `<td>${esc(when)}</td><td>${b.start_time}-${b.end_time}</td><td>${esc(b.user_name||'')}</td>`+
      `<td>${b.uses_meeting?('📶 '+esc(aname(b.meeting_account_id))):'—'}</td>`+
      `<td>${b.status==='pending'?'<span class="badge b-warn">待确认</span>':'<span class="badge b-ok">已确认</span>'}</td>`+
      `<td class="muted">${esc(b.note||'')}</td>`+
      `<td><button class="sm danger" data-delo="${b.id}">删</button></td></tr>`;
  });
  h+='</tbody></table>';
  el('occupyTable').innerHTML=h;
  bind('[data-delo]', async id=>{ if(!confirm('删除该占用记录？')) return;
    await sbDelete('sched_bookings',id); await reloadAll(); if(el('occupyTable')) renderOccupyTable(); toast('已删除'); });
}

  // 全选 + 计数
  const updInfo=()=>{ const n=document.querySelectorAll('.cf_ck:checked').length; el('cf_selinfo').textContent=n?('已选 '+n+' 门'):''; };
  el('cf_all').onchange=()=>{ document.querySelectorAll('.cf_ck').forEach(c=>c.checked=el('cf_all').checked); updInfo(); };
  document.querySelectorAll('.cf_ck').forEach(c=>c.onchange=updInfo);
  el('cf_delsel').onclick=async()=>{
    const ids=[...document.querySelectorAll('.cf_ck:checked')].map(c=>c.value);
    if(!ids.length){ toast('未选择', false); return; }
    if(!confirm('删除所选 '+ids.length+' 门课程及其教室占用？')) return;
    for(const id of ids){ const bs=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(id));
      for(const b of bs) await sbDelete('sched_bookings',b.id); await sbDelete('sched_courses',id); }
    await reloadAll(); show('courses'); toast('已删除 '+ids.length+' 门');
  };
  el('cf_dupscan').onclick=()=>dupScan(list);
  bind('[data-edc]', id=>courseEdit(id));
  bind('[data-delc]', async id=>{ if(!confirm('删除课程及其教室占用？')) return;
    const bs=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(id));
    for(const b of bs) await sbDelete('sched_bookings',b.id);
    await sbDelete('sched_courses',id); await reloadAll(); show('courses'); toast('已删除'); });
}
/* 查找重复：同校区+同周几+同时段+同起止日 归为一组，组内>1 即疑似重复 */
function dupScan(list){
  const groups={};
  list.forEach(c=>{ const k=[c.campus,c.weekdays,c.start_time,c.end_time,c.start_date,c.end_date].join('|');
    (groups[k]=groups[k]||[]).push(c); });
  const dups=Object.values(groups).filter(g=>g.length>1);
  if(!dups.length){ toast('未发现重复'); return; }
  // 高亮并勾选每组“除第一门外”的其余（保留最早一门，其余可删）
  document.querySelectorAll('.cf_ck').forEach(c=>c.checked=false);
  let mark=0;
  dups.forEach(g=>{ g.slice(1).forEach(c=>{ const cb=document.querySelector('.cf_ck[value="'+c.id+'"]');
    if(cb){ cb.checked=true; mark++; } const tr=document.querySelector('tr[data-cid="'+c.id+'"]'); if(tr) tr.style.background='#fffdf0'; }); });
  el('cf_selinfo').textContent='发现 '+dups.length+' 组重复，已勾选其中 '+mark+' 门冗余（各组保留最早一门），可点「删除所选」';
}
function courseEdit(id){
  const c=COURSES.find(x=>String(x.id)===String(id));
  const wd=(c.weekdays||'').split(',').map(Number);
  const slotOpts=(sel)=>SLOTS.map(t=>`<option${t===sel?' selected':''}>${t}</option>`).join('');
  const catOpts=CATEGORIES.map(x=>`<option${x===c.category?' selected':''}>${x}</option>`).join('');
  const campOpts=['高马','市谷','线上'].map(x=>`<option${x===c.campus?' selected':''}>${x}</option>`).join('');
  let h='<div style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:40px 16px">'+
    '<div class="card" style="width:560px;max-width:94vw;margin:auto"><h3 style="margin-top:2px">编辑课程</h3>'+
    '<div class="grid2">'+
    `<div class="field"><label>课程名（统一命名）</label><input id="e_name" value="${esc(c.name)}"></div>`+
    `<div class="field"><label>讲师</label><input id="e_teacher" value="${esc(c.teacher||'')}"></div>`+
    `<div class="field"><label>类别</label><select id="e_cat">${catOpts}</select></div>`+
    `<div class="field"><label>校区</label><select id="e_campus">${campOpts}</select></div>`+
    `<div class="field"><label>专业</label><input id="e_major" value="${esc(c.major||'')}" placeholder="大学院填，如经营"></div>`+
    `<div class="field"><label>课程属性</label><select id="e_ctype"><option value="">（无）</option>`+
      ['共通课','专业课','大课'].map(x=>`<option${x===c.course_type?' selected':''}>${x}</option>`).join('')+`</select></div>`+
    `<div class="field"><label>期</label><input id="e_term" value="${esc(c.term||'')}" placeholder="如 2026年7月期"></div>`+
    `<div class="field"><label>方式</label><select id="e_mode"><option${c.mode==='线下'?' selected':''}>线下</option><option${c.mode==='线上'?' selected':''}>线上</option></select></div>`+
    `<div class="field"><label>开始时间</label><select id="e_st">${slotOpts(c.start_time)}</select></div>`+
    `<div class="field"><label>结束时间</label><select id="e_et">${slotOpts(c.end_time)}</select></div>`+
    `<div class="field"><label>开课日</label><input type="date" id="e_sd" value="${c.start_date||''}"></div>`+
    `<div class="field"><label>结课日</label><input type="date" id="e_ed" value="${c.end_date||''}"></div>`+
    `<div class="field"><label>回数</label><input type="number" id="e_sess" value="${c.sessions||''}"></div>`+
    `<div class="field"><label>预估人数</label><input type="number" id="e_est" value="${c.est_students||''}"></div>`+
    '</div>'+
    '<div class="field" style="margin-top:8px"><label>周几（可多选）</label><div id="e_wd" style="display:flex;gap:6px;flex-wrap:wrap"></div></div>'+
    `<div class="field" style="margin-top:8px"><label>腾讯会议链接</label><input id="e_link" value="${esc(c.meeting_link||'')}"></div>`+
    '<div class="field" style="margin-top:10px;border-top:1px dashed var(--line);padding-top:10px">'+
      '<label>休讲日期（撞节假日等，该天不上课、日历标灰）</label>'+
      '<div id="e_skipList" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"></div>'+
      '<div class="row"><input type="date" id="e_skipAdd"><button type="button" class="ghost sm" id="e_skipBtn">添加休讲日</button>'+
      '<button type="button" class="ghost sm" id="e_postpone">按休讲次数顺延结课日</button></div>'+
      '<div class="muted" id="e_skipInfo" style="font-size:12px;margin-top:4px"></div></div>'+
    '<div id="e_warn" class="hidden" style="margin-top:8px"></div>'+
    '<div style="margin-top:12px"><button id="e_save">保存</button> <button class="ghost" id="e_cancel">取消</button>'+
    '<span class="muted" style="font-size:12px;margin-left:8px">若已排教室，改动周几/时间后建议去「排教室」重排。</span></div></div></div>';
  el('cEdit').innerHTML=h;
  // 周几切换
  const box=el('e_wd');
  for(let d=1;d<=7;d++){ const b=document.createElement('button'); b.type='button'; b.className='ghost sm';
    b.textContent=WEEKDAYS[d]; b.dataset.d=d; if(wd.includes(d)){ b.dataset.on='1'; b.style.background='var(--blue)'; b.style.color='#fff'; }
    b.onclick=()=>{ const on=b.dataset.on==='1'; b.dataset.on=on?'':'1'; b.style.background=on?'#fff':'var(--blue)'; b.style.color=on?'var(--ink)':'#fff'; };
    box.appendChild(b); }
  el('e_cancel').onclick=()=>el('cEdit').innerHTML='';
  // 休讲日期管理
  let SKIP = (c.skip_dates||'').split(',').map(s=>s.trim()).filter(Boolean).sort();
  function renderSkip(){
    el('e_skipList').innerHTML = SKIP.length ? SKIP.map(d=>
      `<span class="badge b-mute" style="cursor:pointer" data-sk="${d}">${d} ✕</span>`).join('')
      : '<span class="muted" style="font-size:12px">暂无</span>';
    el('e_skipList').querySelectorAll('[data-sk]').forEach(x=>x.onclick=()=>{ SKIP=SKIP.filter(d=>d!==x.dataset.sk); renderSkip(); });
    el('e_skipInfo').textContent = SKIP.length? ('共 '+SKIP.length+' 次休讲；顺延会把结课日按上课周期往后推 '+SKIP.length+' 周') : '';
  }
  renderSkip();
  el('e_skipBtn').onclick=()=>{ const d=el('e_skipAdd').value; if(d && !SKIP.includes(d)){ SKIP.push(d); SKIP.sort(); renderSkip(); } };
  el('e_postpone').onclick=()=>{
    const ed=el('e_ed').value; const days=[...box.querySelectorAll('button[data-on="1"]')].map(b=>Number(b.dataset.d));
    if(!ed){ el('e_warn').className=''; el('e_warn').innerHTML='<span class="badge b-err">请先填结课日</span>'; return; }
    if(!days.length){ el('e_warn').className=''; el('e_warn').innerHTML='<span class="badge b-err">请先选周几</span>'; return; }
    // 每休讲一次，结课日顺延到“下一个上课日”，重复 SKIP.length 次
    let d=ed;
    for(let i=0;i<SKIP.length;i++){ do{ d=addDays(d,1); }while(!days.includes(weekdayOf(d))); }
    el('e_ed').value=d;
    el('e_warn').className=''; el('e_warn').innerHTML='<span class="badge b-ok">结课日已顺延至 '+d+'（可再手动微调）</span>';
  };
  el('e_save').onclick=async()=>{
    const days=[...box.querySelectorAll('button[data-on="1"]')].map(b=>b.dataset.d).join(',');
    const st=el('e_st').value, et=el('e_et').value;
    if(et<=st){ el('e_warn').className=''; el('e_warn').innerHTML='<span class="badge b-err">结束需晚于开始</span>'; return; }
    const patch={ name:el('e_name').value.trim(), teacher:el('e_teacher').value.trim()||null,
      category:el('e_cat').value, campus:el('e_campus').value, term:el('e_term').value.trim()||null,
      major:el('e_major').value.trim()||null, course_type:el('e_ctype').value||null,
      mode:el('e_mode').value, start_time:st, end_time:et,
      start_date:el('e_sd').value||null, end_date:el('e_ed').value||null,
      weekdays:days, sessions:el('e_sess').value?Number(el('e_sess').value):null,
      est_students:el('e_est').value?Number(el('e_est').value):null, meeting_link:el('e_link').value.trim()||null,
      skip_dates: SKIP.length? SKIP.join(',') : null };
    try{
      await sbUpdate('sched_courses', c.id, patch);
      // 若已排教室，同步把休讲日/结课日写进对应占用，看板才准
      const bs=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(c.id));
      for(const b of bs) await sbUpdate('sched_bookings', b.id, {end_date:patch.end_date, note: SKIP.length?('排课自动生成；休讲:'+SKIP.join(',')):'排课自动生成'});
      await reloadAll(); show('courses'); toast('已保存');
    }catch(e){ el('e_warn').className=''; el('e_warn').innerHTML='<span class="badge b-err">'+esc(e.message)+'</span>'; }
  };
}

/* ---------- 口令 CRUD ---------- */
function tabCodes(){
  const base = location.origin + location.pathname.replace(/admin\.html$/,'') ;
  let h='<div class="card"><h3 style="margin-top:2px">角色权限</h3>'+
    '<div class="tip">每个角色一条：勾选它能用的功能（点击标签切换），保存后生效。把「专属链接」发给对应的人，他们打开就只看到自己有权限的功能。</div>'+
    '<table><thead><tr><th>角色</th><th>功能权限（点击切换）</th><th>专属链接</th><th>状态</th><th></th></tr></thead><tbody>';
  CODES.slice().sort((a,b)=>(a.sort||100)-(b.sort||100)).forEach(c=>{
    const ps = new Set((c.perms?c.perms.split(','):[]).map(s=>s.trim()).filter(Boolean));
    const chips = PERM_DEFS
      // 同页两种录入分别显示（entry_room / entry_room_full）
      .map(([perm,label])=>{
        const on = ps.has(perm);
        const nm = perm==='entry_room'?'录入(仅临时)':perm==='entry_room_full'?'录入(全部)':label;
        return `<span class="permchip${on?' on':''}" data-perm="${perm}" data-cid="${c.id}">${on?'✓ ':''}${esc(nm)}</span>`;
      }).join(' ');
    const link = base+'index.html?k='+encodeURIComponent(c.code);
    h+=`<tr><td><b>${esc(c.label||c.role||'')}</b><br><small class="muted">${esc(c.role||'')}</small></td>`+
      `<td style="max-width:520px">${chips}</td>`+
      `<td style="max-width:220px"><input readonly value="${esc(link)}" style="width:190px;font-size:11px" data-link="${c.id}"> <button class="sm ghost" data-copy="${c.id}">复制</button></td>`+
      `<td>${c.active?'<span class="badge b-ok">启用</span>':'<span class="badge b-mute">停用</span>'}</td>`+
      `<td><button class="sm ghost" data-savep="${c.id}">保存</button> <button class="sm ghost" data-togc="${c.id}">${c.active?'停用':'启用'}</button> <button class="sm danger" data-delc2="${c.id}">删</button></td></tr>`;
  });
  h+='</tbody></table>'+
    '<h4 style="margin:16px 0 8px">新增角色</h4><div class="row">'+
    '<div class="field"><label>角色显示名</label><input id="nc_label" placeholder="如 教务助理"></div>'+
    '<div class="field"><label>角色标识</label><input id="nc_role" placeholder="如 assistant" style="width:120px"></div>'+
    '<div class="field"><label>编码(链接用,留空自动生成)</label><input id="nc_code" placeholder="留空自动" style="width:140px"></div>'+
    '<div class="field"><label>&nbsp;</label><button id="nc_add">新增</button></div></div>'+
    '<p class="muted" style="font-size:12px;margin-top:6px">新增后在上表勾选它的权限并保存。</p></div>';
  render(h);

  // 本地暂存每行勾选状态
  const draft={}; CODES.forEach(c=>draft[c.id]=new Set((c.perms?c.perms.split(','):[]).map(s=>s.trim()).filter(Boolean)));
  document.querySelectorAll('.permchip').forEach(chip=>{
    chip.onclick=()=>{
      const cid=chip.getAttribute('data-cid'), perm=chip.getAttribute('data-perm');
      if(draft[cid].has(perm)){ draft[cid].delete(perm); chip.classList.remove('on'); chip.textContent=chip.textContent.replace('✓ ',''); }
      else { draft[cid].add(perm); chip.classList.add('on'); if(!chip.textContent.startsWith('✓')) chip.textContent='✓ '+chip.textContent; }
    };
  });
  bind('[data-savep]', async id=>{ const perms=[...draft[id]].join(','); await sbUpdate('sched_access_codes',id,{perms}); await reloadAll(); toast('权限已保存'); });
  bind('[data-togc]', async id=>{ const c=CODES.find(x=>String(x.id)===String(id)); await sbUpdate('sched_access_codes',id,{active:!c.active}); await reloadAll(); show('codes'); });
  bind('[data-delc2]', async id=>{ if(confirm('删除该角色？其链接将失效。')){ await sbDelete('sched_access_codes',id); await reloadAll(); show('codes'); } });
  bind('[data-copy]', id=>{ const inp=document.querySelector(`[data-link="${id}"]`); navigator.clipboard.writeText(inp.value).then(()=>toast('链接已复制')); });
  el('nc_add').onclick=async()=>{
    const label=el('nc_label').value.trim(), role=el('nc_role').value.trim();
    if(!label){ toast('填角色显示名',false); return; }
    let code=el('nc_code').value.trim(); if(!code){ code=(role||'r')+'-'+Math.random().toString(36).slice(2,8); }
    await sbInsert('sched_access_codes',{code,role:role||label,label,perms:'timetable',sort:100,active:true});
    await reloadAll(); show('codes'); toast('已新增，请勾选权限并保存');
  };
}

/* helpers */
function render(html){ el('panel').innerHTML=html; }
function bind(sel, fn){
  const attr = sel.match(/data-[\w-]+/)[0];
  document.querySelectorAll(sel).forEach(b => { b.onclick = () => fn(b.getAttribute(attr)); });
}
