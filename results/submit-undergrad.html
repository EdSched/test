<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合格实绩录入 · 学部 · 唯新教育</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f5f0;--surface:#fff;--border:#e2ded6;--border-light:#ede9e2;
  --text-primary:#1a1814;--text-secondary:#5a5650;--text-muted:#9a9590;--accent:#3a6630;
  --green:#2a5a30;--green-bg:#e8f4ea;--red:#7a2010;--red-bg:#faeae8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text-primary);font-size:13px;line-height:1.6}

header{background:var(--surface);border-bottom:3px solid var(--accent);padding:2rem 2rem 1.5rem;text-align:center}
.h-title{font-family:'Noto Serif SC',serif;font-size:1.6rem;font-weight:600;color:var(--accent);letter-spacing:.04em}
.h-sub{font-size:11px;color:var(--text-muted);margin-top:6px;letter-spacing:.06em}

main{max-width:680px;margin:2rem auto;padding:0 1.5rem 4rem}

.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1.5rem;margin-bottom:1.2rem}
.card-title{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border-light)}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11px;color:var(--text-secondary);letter-spacing:.04em}
.field label .req{color:var(--accent);margin-left:3px}
.field input,.field select,.field textarea{
  padding:9px 12px;border:1px solid var(--border);border-radius:4px;
  background:var(--bg);font-family:inherit;font-size:13px;color:var(--text-primary);
  transition:border-color .12s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.field textarea{resize:vertical;min-height:80px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}

.track-btns{display:flex;gap:8px}
.track-btn{
  flex:1;padding:10px;border:2px solid var(--border);border-radius:4px;background:var(--bg);
  font-family:inherit;font-size:12px;color:var(--text-secondary);cursor:pointer;text-align:center;
  transition:all .12s;font-weight:500;
}
.track-btn.active-bunka{border-color:#2c4a8a;background:#e8edf8;color:#2c4a8a}
.track-btn.active-rika{border-color:#3a6630;background:#e8f0e4;color:#3a6630}

.eju-section{display:none}
.eju-section.show{display:block}

.hint{font-size:10px;color:var(--text-muted);margin-top:3px}

.submit-btn{
  width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:5px;
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.06em;
  transition:opacity .15s;
}
.submit-btn:hover{opacity:.88}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:5px;font-size:13px;display:none;z-index:999;text-align:center;min-width:260px}
.toast.show{display:block}
.toast-ok{background:var(--green-bg);color:var(--green);border:1px solid #b8d8bc}
.toast-err{background:var(--red-bg);color:var(--red);border:1px solid #e8c0b8}

.success-screen{display:none;text-align:center;padding:3rem 1rem}
.success-icon{font-size:3rem;margin-bottom:1rem}
.success-title{font-family:'Noto Serif SC',serif;font-size:1.4rem;color:var(--green);margin-bottom:.5rem}
.success-sub{font-size:12px;color:var(--text-muted)}
.success-btn{margin-top:1.5rem;padding:10px 24px;background:var(--surface);border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:12px;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="h-title">合格实绩录入 · 学部</div>
  <div class="h-sub">唯新教育 · 请填写您的合格信息</div>
</header>

<main>
  <div id="form-area">
    <div class="card">
      <div class="card-title">院校信息</div>
      <div class="field">
        <label>大学名<span class="req">*</span></label>
        <input id="f-univ" type="text" placeholder="例：早稲田大学">
      </div>
      <div class="grid-2">
        <div class="field">
          <label>学部名</label>
          <input id="f-dept" type="text" placeholder="例：商学部">
        </div>
        <div class="field">
          <label>学科名</label>
          <input id="f-spec" type="text" placeholder="例：経営学科">
        </div>
      </div>
      <div class="field">
        <label>入学年度<span class="req">*</span></label>
        <select id="f-era">
          <option value="new">2025–2026 入学</option>
          <option value="hist">2022–2024 実绩</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="card-title">志望方向<span class="req">*</span></div>
      <div class="track-btns">
        <button class="track-btn active-bunka" id="btn-bunka" onclick="setTrack('bunka')">文科</button>
        <button class="track-btn" id="btn-rika" onclick="setTrack('rika')">理科</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">EJU 成绩</div>

      <!-- 文科EJU -->
      <div class="eju-section show" id="eju-bunka">
        <div class="grid-2">
          <div class="field">
            <label>EJU 日本語</label>
            <input id="f-eju-jp" type="number" placeholder="例：354" min="0" max="400">
            <div class="hint">読解+聴解，满分400</div>
          </div>
          <div class="field">
            <label>EJU 記述</label>
            <input id="f-eju-kijutsu" type="number" placeholder="例：45" min="0" max="50">
            <div class="hint">满分50</div>
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label>EJU 文系総合</label>
            <input id="f-eju-bunsou" type="number" placeholder="例：150" min="0" max="200">
            <div class="hint">满分200</div>
          </div>
          <div class="field">
            <label>EJU 総分</label>
            <input id="f-eju-total-b" type="number" placeholder="例：549" min="0">
          </div>
        </div>
      </div>

      <!-- 理科EJU -->
      <div class="eju-section" id="eju-rika">
        <div class="grid-2">
          <div class="field">
            <label>EJU 日本語</label>
            <input id="f-eju-jp-r" type="number" placeholder="例：354" min="0" max="400">
          </div>
          <div class="field">
            <label>EJU 数学</label>
            <input id="f-eju-math" type="number" placeholder="例：193" min="0" max="200">
          </div>
        </div>
        <div class="grid-3">
          <div class="field">
            <label>EJU 物理</label>
            <input id="f-eju-phys" type="number" placeholder="例：93" min="0" max="200">
          </div>
          <div class="field">
            <label>EJU 化学</label>
            <input id="f-eju-chem" type="number" placeholder="例：95" min="0" max="200">
          </div>
          <div class="field">
            <label>EJU 生物</label>
            <input id="f-eju-bio" type="number" placeholder="" min="0" max="200">
          </div>
        </div>
        <div class="field">
          <label>EJU 総分</label>
          <input id="f-eju-total-r" type="number" placeholder="例：735" min="0">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">语言成绩</div>
      <div class="grid-2">
        <div class="field">
          <label>JLPT 级别</label>
          <select id="f-jlpt">
            <option value="">—</option>
            <option value="N1">N1</option>
            <option value="N2">N2</option>
            <option value="N3">N3</option>
          </select>
        </div>
        <div class="field">
          <label>英语成绩</label>
          <div class="grid-2" style="gap:8px;margin:0">
            <select id="f-eng-type">
              <option value="">—</option>
              <option value="TOEIC">TOEIC</option>
              <option value="TOEFL">TOEFL</option>
              <option value="IELTS">IELTS</option>
            </select>
            <input id="f-eng-score" type="number" placeholder="分数" min="0">
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">其他</div>
      <div class="field">
        <label>学生名（可用代号）</label>
        <input id="f-student" type="text" placeholder="例：A同学">
      </div>
      <div class="field">
        <label>备注</label>
        <textarea id="f-note" placeholder="其他想补充的信息（选填）"></textarea>
      </div>
    </div>

    <button class="submit-btn" onclick="submitForm()">提交合格信息</button>
  </div>

  <div class="success-screen" id="success-screen">
    <div class="success-icon">✓</div>
    <div class="success-title">提交成功！</div>
    <div class="success-sub">感谢您的录入，数据已保存。</div>
    <button class="success-btn" onclick="resetForm()">继续录入</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://vwntezfvqbrkeovnseku.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cUnCkti5qv1_G4N6Ho5tpw_9pr7pSas';

let curTrack = 'bunka';

function setTrack(t) {
  curTrack = t;
  document.getElementById('btn-bunka').className = 'track-btn' + (t==='bunka'?' active-bunka':'');
  document.getElementById('btn-rika').className = 'track-btn' + (t==='rika'?' active-rika':'');
  document.getElementById('eju-bunka').className = 'eju-section' + (t==='bunka'?' show':'');
  document.getElementById('eju-rika').className = 'eju-section' + (t==='rika'?' show':'');
}

async function submitForm() {
  const univ = document.getElementById('f-univ').value.trim();
  if (!univ) { showToast('请填写大学名', false); return; }

  const n = id => { const v=document.getElementById(id).value; return v!==''?parseInt(v):null; };

  // EJU値はtrack別に取得
  const eju_japanese = curTrack==='bunka' ? n('f-eju-jp') : n('f-eju-jp-r');
  const eju_total    = curTrack==='bunka' ? n('f-eju-total-b') : n('f-eju-total-r');

  // trackに基づいてschool_typeとtierは自動判定（サーバー側に任せる）
  const row = {
    univ,
    dept: document.getElementById('f-dept').value.trim() || null,
    spec: document.getElementById('f-spec').value.trim() || null,
    student: document.getElementById('f-student').value.trim() || null,
    track: curTrack,
    era: document.getElementById('f-era').value,
    eju_japanese,
    eju_kijutsu:  curTrack==='bunka' ? n('f-eju-kijutsu') : null,
    eju_bunsou:   curTrack==='bunka' ? n('f-eju-bunsou') : null,
    eju_math:     curTrack==='rika'  ? n('f-eju-math') : null,
    eju_physics:  curTrack==='rika'  ? n('f-eju-phys') : null,
    eju_chemistry:curTrack==='rika'  ? n('f-eju-chem') : null,
    eju_biology:  curTrack==='rika'  ? n('f-eju-bio') : null,
    eju_total,
    jlpt: document.getElementById('f-jlpt').value || null,
    toefl: document.getElementById('f-eng-type').value==='TOEFL' ? n('f-eng-score') : null,
    toeic: document.getElementById('f-eng-type').value==='TOEIC' ? n('f-eng-score') : null,
    note: document.getElementById('f-note').value.trim() || null,
  };

  const btn = document.querySelector('.submit-btn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/undergrad_results`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify(row),
    });
    if (!res.ok) throw new Error(await res.text());
    document.getElementById('form-area').style.display = 'none';
    document.getElementById('success-screen').style.display = 'block';
  } catch(e) {
    showToast('提交失败：' + e.message, false);
    btn.disabled = false;
    btn.textContent = '提交合格信息';
  }
}

function resetForm() {
  ['f-univ','f-dept','f-spec','f-student','f-note',
   'f-eju-jp','f-eju-kijutsu','f-eju-bunsou','f-eju-total-b',
   'f-eju-jp-r','f-eju-math','f-eju-phys','f-eju-chem','f-eju-bio','f-eju-total-r',
   'f-eng-score'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.value = '';
  });
  ['f-era','f-jlpt','f-eng-type'].forEach(id => {
    document.getElementById(id).selectedIndex = 0;
  });
  setTrack('bunka');
  document.getElementById('form-area').style.display = '';
  document.getElementById('success-screen').style.display = 'none';
  const btn = document.querySelector('.submit-btn');
  btn.disabled = false;
  btn.textContent = '提交合格信息';
}

let toastTimer;
function showToast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${ok?'toast-ok':'toast-err'}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 3000);
}
</script>
</body>
</html>
